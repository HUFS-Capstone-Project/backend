spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/udidura_benchmark}
    username: ${DB_USERNAME:udidura}
    password: ${DB_PASSWORD:udidura}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME:UdiduraHikariPool}
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: false
  sql:
    init:
      mode: always
      platform: postgresql
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: benchmark-google-client-id
            client-secret: benchmark-google-client-secret

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      environment: benchmark

logging:
  level:
    root: warn
    com.hufs.capstone.backend.link.infrastructure.config: info

app:
  scheduling:
    enabled: false
  business-hours:
    requests-enabled: false
    polling:
      enabled: false
  link:
    dispatch:
      max-attempts: 1
      recovery-enabled: false
      executor:
        core-pool-size: ${LINK_DISPATCH_CORE_POOL_SIZE:2}
        max-pool-size: ${LINK_DISPATCH_MAX_POOL_SIZE:4}
        queue-capacity: ${LINK_DISPATCH_QUEUE_CAPACITY:100}
        await-termination-seconds: 30
  auth:
    dev-token:
      enabled: true
    jwt:
      secret-base64: ${AUTH_JWT_SECRET_BASE64:VGhpc0lzQVN0cm9uZ0JlbmNobWFya1NlY3JldEtleUZvclVkaWR1cmE=}
    refresh:
      hash-secret: ${AUTH_REFRESH_HASH_SECRET:benchmark-refresh-hash-secret}
    cookie:
      refresh-cookie-name: udidura_benchmark_rt
      oauth-context-cookie-name: udidura_benchmark_octx
      secure: false
      domain:
    redirect:
      web-base-url: http://localhost:3000
      app-link-base-url: http://localhost:3000/callback

processing:
  base-url: ${PROCESSING_BASE_URL:http://localhost:8081}
  internal-api-key: benchmark-processing-key
  connect-timeout-ms: 1000
  read-timeout-ms: ${PROCESSING_READ_TIMEOUT_MS:10000}

kakao:
  local:
    base-url: http://localhost:8081
    rest-api-key: benchmark-kakao-key
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
