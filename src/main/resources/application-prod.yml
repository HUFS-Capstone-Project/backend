spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

logging:
  level:
    root: info
    com.hufs.capstone.backend: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: None
        secure: true
        path: /

app:
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  region:
    seed:
      async: ${REGION_SEED_ASYNC:true}
  business-hours:
    polling:
      enabled: ${BUSINESS_HOURS_POLLING_ENABLED:true}
      interval: ${BUSINESS_HOURS_POLLING_INTERVAL:3s}
      batch-size: ${BUSINESS_HOURS_POLLING_BATCH_SIZE:50}
      scheduler-delay-ms: ${BUSINESS_HOURS_POLLING_SCHEDULER_DELAY_MS:3000}
  security:
    csrf:
      cookie:
        same-site: None
        secure: true
        path: /
  cors:
    allowed-origins:
      - https://udidura.vercel.app
      # 운영 모바일 앱의 Capacitor WebView origin
      - https://localhost
      - capacitor://localhost
    allow-credentials: true
  auth:
    dev-token:
      enabled: false
    jwt:
      issuer: ${AUTH_JWT_ISSUER:udidura-backend}
      audience: ${AUTH_JWT_AUDIENCE:udidura-api}
      secret-base64: ${AUTH_JWT_SECRET_BASE64}
    refresh:
      hash-secret: ${AUTH_REFRESH_HASH_SECRET}
    cookie:
      refresh-cookie-name: __Host-udidura_rt
      oauth-context-cookie-name: __Host-udidura_octx
      secure: true
      same-site: None
      refresh-path: /
      oauth-context-path: /
      domain:
    redirect:
      web-base-url: ${WEB_BASE_URL}
      app-link-base-url: ${APP_LINK_BASE_URL}

processing:
  base-url: ${PROCESSING_BASE_URL}
  internal-api-key: ${PROCESSING_INTERNAL_API_KEY}
  connect-timeout-ms: ${PROCESSING_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${PROCESSING_READ_TIMEOUT_MS:30000}

kakao:
  local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY}
    connect-timeout-ms: ${KAKAO_LOCAL_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${KAKAO_LOCAL_READ_TIMEOUT_MS:5000}
